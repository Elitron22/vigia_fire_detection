schema_version: 1
dataset_version: dfire_seed42_val10_v1
split: val

# Identificadores explícitos: nuevos entrenamientos requieren otra configuración.
experiments:
  yolov8s: legacy_yolov8s_baseline
  yolo26s: yolo26s_dfire_seed42_20260830T225658Z
  yolo26n: yolo26n_dfire_seed42_20260831T074308Z

prediction_confidence: 0.01
thresholds: [0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
reference_threshold: 0.25
match_iou: 0.50
nms_iou: 0.70
imgsz: 640
chunk_size: 4
ram_limit_gib: 6.0
seed: 42

# Escenarios exploratorios, no requisitos operativos aprobados.
alarm_budgets: [0.01, 0.02, 0.05]
selection_objective: macro_recall
# Desempate: mayor recall mínimo por clase, F1 micro, menos alarmas, mayor umbral.
review_budget: 0.02
# Bandas propias sobre área de la caja / área de imagen original; no son COCO.
size_area_boundaries: [0.01, 0.10]
gallery_images_per_model: 6
